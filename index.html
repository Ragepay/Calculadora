<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Profesional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-btn" class="theme-btn" aria-label="Cambiar tema">☀️</button>
    <div class="calculator-wrapper">
        <div class="calculator">
            <div class="display">
                <div class="previous-operand" data-previous-operand></div>
                <div class="current-operand" data-current-operand>0</div>
            </div>
            <div class="keypad">
                <button data-action="clear" class="span-two utility">AC</button>
                <button data-action="delete" class="utility">DEL</button>
                <button data-operation="÷" class="operation">÷</button>
                
                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>
                <button data-operation="×" class="operation">×</button>
                
                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>
                <button data-operation="-" class="operation">-</button>
                
                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>
                <button data-operation="+" class="operation">+</button>
                
                <button data-operation="^" class="operation">xⁿ</button>
                <button data-number="0">0</button>
                <button data-number=".">,</button>
                <button data-action="compute" class="operation equals">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
